[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Basic security headers for every page and file.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN rather than DENY keeps the CMS preview and any own-site embeds working.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Enforced on every page. The Netlify Identity widget (invite / recovery links)
    # is the only third-party script on public pages. /admin gets its own, looser
    # policy below because Decap CMS loads from unpkg.com.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

# The CMS shell. Listed after /* so this Content-Security-Policy replaces the
# strict one above for /admin only. Decap CMS needs its script from unpkg.com,
# inline styles, blob: previews and the GitHub API (git-gateway). 'unsafe-eval'
# is required: Decap CMS evaluates its config/widgets with eval and fails to load without it.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data: https://unpkg.com; connect-src 'self' https://api.github.com https://identity.netlify.com https://*.netlify.com; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'"

# Keep the resume PDF out of search results and caches. Do not block it in
# robots.txt for Googlebot: crawlers must be able to fetch it to see this header.
[[headers]]
  for = "/Mike-Fang-Resume.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro fingerprints everything under /_astro/, so it can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

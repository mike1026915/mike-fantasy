[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Basic security headers for every page and file.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN rather than DENY keeps the CMS preview and any own-site embeds working.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the resume PDF out of search results and caches. Do not block it in
# robots.txt for Googlebot: crawlers must be able to fetch it to see this header.
[[headers]]
  for = "/Mike-Fang-Resume.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro fingerprints everything under /_astro/, so it can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
